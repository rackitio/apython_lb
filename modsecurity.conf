# ModSecurity configuration for apython_lb
# Loaded when MODSECURITY_ENABLED=true
# ─────────────────────────────────────────────────────────────────────────── #

# ── Engine ──────────────────────────────────────────────────────────────── #
SecRuleEngine On

# ── Request body ────────────────────────────────────────────────────────── #
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# ── Response body ──────────────────────────────────────────────────────── #
# Disabled — inspecting upstream response bodies adds latency with no benefit
# in a pure reverse-proxy deployment.
SecResponseBodyAccess Off

# ── Temp / data dirs ────────────────────────────────────────────────────── #
SecTmpDir /tmp/
SecDataDir /tmp/

# ── Audit logging ───────────────────────────────────────────────────────── #
# Only log 4xx/5xx responses (exclude 404 — tracked separately by IPTracker).
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABCIJDFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr

# ── Default action ──────────────────────────────────────────────────────── #
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# ─────────────────────────────────────────────────────────────────────────── #
#  RULES                                                                       #
# ─────────────────────────────────────────────────────────────────────────── #

# ── Null byte injection (phase 1 — URI / headers) ──────────────────────── #
SecRule REQUEST_URI|REQUEST_HEADERS "@rx \x00" \
    "id:910001,\
    phase:1,\
    deny,status:400,\
    log,\
    msg:'Null byte in request URI or headers',\
    t:none,t:urlDecodeUni"

# ── Path traversal ──────────────────────────────────────────────────────── #
SecRule REQUEST_URI|ARGS "@rx (?:\.\.[\\/]|[\\/]\.\.)" \
    "id:910002,\
    phase:1,\
    deny,status:400,\
    log,\
    msg:'Path traversal attempt detected',\
    t:none,t:urlDecodeUni,t:normalizePath"

# ── HTTP request smuggling — unusual Transfer-Encoding ─────────────────── #
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i:chunked|identity)[,\s]" \
    "id:910003,\
    phase:1,\
    deny,status:400,\
    log,\
    msg:'HTTP request smuggling — ambiguous Transfer-Encoding'"

# ── Excessively long URI ────────────────────────────────────────────────── #
SecRule REQUEST_URI "@rx .{2049,}" \
    "id:910004,\
    phase:1,\
    deny,status:414,\
    log,\
    msg:'Request URI exceeds 2048 characters'"

# ── Known security scanner User-Agents ─────────────────────────────────── #
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i:sqlmap|nikto|nmap|masscan|w3af|skipfish|dirbuster|gobuster|wfuzz|burpsuite|metasploit|hydra|havij|acunetix|nessus|openvas)" \
    "id:910010,\
    phase:1,\
    deny,status:403,\
    log,\
    msg:'Request from known security scanner'"

# ── SQL injection — URI and query args (phase 1) ────────────────────────── #
SecRule REQUEST_URI|ARGS "@detectSQLi" \
    "id:910020,\
    phase:1,\
    deny,status:403,\
    log,\
    msg:'SQL injection detected in URI or query string',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── XSS — URI and query args (phase 1) ─────────────────────────────────── #
SecRule REQUEST_URI|ARGS "@detectXSS" \
    "id:910021,\
    phase:1,\
    deny,status:403,\
    log,\
    msg:'XSS attack detected in URI or query string',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── SQL injection — request body (phase 2) ──────────────────────────────── #
SecRule ARGS|REQUEST_BODY "@detectSQLi" \
    "id:910030,\
    phase:2,\
    deny,status:403,\
    log,\
    msg:'SQL injection detected in request body',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── XSS — request body (phase 2) ────────────────────────────────────────── #
SecRule ARGS|REQUEST_BODY "@detectXSS" \
    "id:910031,\
    phase:2,\
    deny,status:403,\
    log,\
    msg:'XSS attack detected in request body',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── Remote file inclusion ────────────────────────────────────────────────── #
SecRule ARGS|REQUEST_BODY "@rx (?i:https?|ftp)://" \
    "id:910032,\
    phase:2,\
    deny,status:403,\
    log,\
    msg:'Remote file inclusion attempt detected',\
    t:none,t:urlDecodeUni,t:lowercase"
