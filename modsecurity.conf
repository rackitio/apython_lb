# ModSecurity configuration for apython_lb
# Loaded when MODSECURITY_ENABLED=true
# ─────────────────────────────────────────────────────────────────────────── #

# ── Engine ──────────────────────────────────────────────────────────────── #
SecRuleEngine On

# ── Request body ────────────────────────────────────────────────────────── #
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
# SecRequestBodyNoFilesLimit is documented to cap the body of a request that
# carries no file upload to this many bytes, but doesn't: verified against
# libmodsecurity 3.0.17 (ctypes API used by classes/modsecurity.py) that a
# 500KB no-file body sails through untouched with this directive alone —
# msc_process_request_body() never turns a NoFilesLimit overage into an
# intervention the way it does for SecRequestBodyLimit. Left in place
# (harmless, and it's what the upstream docs say to set), but rule 910042
# below is the thing that actually enforces a per-field size cap here.
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# ── Response body ──────────────────────────────────────────────────────── #
# Disabled — inspecting upstream response bodies adds latency with no benefit
# in a pure reverse-proxy deployment.
SecResponseBodyAccess Off

# ── Temp / data dirs ────────────────────────────────────────────────────── #
SecTmpDir /tmp/
SecDataDir /tmp/

# ── Audit logging ───────────────────────────────────────────────────────── #
# Only log 4xx/5xx responses (exclude 404 — tracked separately by IPTracker).
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABCIJDFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr

# ── Default action ──────────────────────────────────────────────────────── #
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# ─────────────────────────────────────────────────────────────────────────── #
#  RULES                                                                       #
# ─────────────────────────────────────────────────────────────────────────── #

# ── Null byte injection (phase 1 — URI / headers) ──────────────────────── #
SecRule REQUEST_URI|REQUEST_HEADERS "@rx \x00" \
    "id:910001,\
    phase:1,\
    deny,status:400,\
    log,\
    msg:'Null byte in request URI or headers',\
    t:none,t:urlDecodeUni"

# ── Path traversal ──────────────────────────────────────────────────────── #
SecRule REQUEST_URI|ARGS "@rx (?:\.\.[\\/]|[\\/]\.\.)" \
    "id:910002,\
    phase:1,\
    deny,status:400,\
    log,\
    msg:'Path traversal attempt detected',\
    t:none,t:urlDecodeUni,t:normalizePath"

# ── HTTP request smuggling — unusual Transfer-Encoding ─────────────────── #
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i:chunked|identity)[,\s]" \
    "id:910003,\
    phase:1,\
    deny,status:400,\
    log,\
    msg:'HTTP request smuggling — ambiguous Transfer-Encoding'"

# ── Excessively long URI ────────────────────────────────────────────────── #
SecRule REQUEST_URI "@rx .{2049,}" \
    "id:910004,\
    phase:1,\
    deny,status:414,\
    log,\
    msg:'Request URI exceeds 2048 characters'"

# ── Known security scanner User-Agents ─────────────────────────────────── #
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i:sqlmap|nikto|nmap|masscan|w3af|skipfish|dirbuster|gobuster|wfuzz|burpsuite|metasploit|hydra|havij|acunetix|nessus|openvas)" \
    "id:910010,\
    phase:1,\
    deny,status:403,\
    log,\
    msg:'Request from known security scanner'"

# ── SQL injection — URI and query args (phase 1) ────────────────────────── #
SecRule REQUEST_URI|ARGS "@detectSQLi" \
    "id:910020,\
    phase:1,\
    deny,status:403,\
    log,\
    msg:'SQL injection detected in URI or query string',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── XSS — URI and query args (phase 1) ─────────────────────────────────── #
SecRule REQUEST_URI|ARGS "@detectXSS" \
    "id:910021,\
    phase:1,\
    deny,status:403,\
    log,\
    msg:'XSS attack detected in URI or query string',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── SQL injection — request body (phase 2) ──────────────────────────────── #
SecRule ARGS|REQUEST_BODY "@detectSQLi" \
    "id:910030,\
    phase:2,\
    deny,status:403,\
    log,\
    msg:'SQL injection detected in request body',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── XSS — request body (phase 2) ────────────────────────────────────────── #
SecRule ARGS|REQUEST_BODY "@detectXSS" \
    "id:910031,\
    phase:2,\
    deny,status:403,\
    log,\
    msg:'XSS attack detected in request body',\
    t:none,t:urlDecodeUni,t:removeNulls"

# ── Remote file inclusion ────────────────────────────────────────────────── #
SecRule ARGS|REQUEST_BODY "@rx (?i:https?|ftp)://" \
    "id:910032,\
    phase:2,\
    deny,status:403,\
    log,\
    msg:'Remote file inclusion attempt detected',\
    t:none,t:urlDecodeUni,t:lowercase"

# ── PHP2Shell (CVE-2026-109618 / CVE-2026-109619) ───────────────────────── #
# Two unauthenticated PHP core RCEs disclosed 2026-10-21, patched in PHP
# 8.5.12/8.4.27/8.3.36/8.2.35. Every confirmed trigger published so far is a
# multipart/form-data request; session.upload_progress (on by default) is a
# confirmed path for both bugs. Full exploit primitives haven't been
# published (responsible disclosure during active exploitation), so these
# rules cover the shapes vendors have confirmed, not every possible variant
# — they're a stopgap for the window before every PHP backend behind this
# proxy is patched, not a substitute for patching.

# PHP's session.upload_progress feature stashes upload-progress state under
# a field named by session.upload_progress.name (default, and the
# overwhelming majority of real deployments: PHP_SESSION_UPLOAD_PROGRESS).
# Legitimate apps essentially never send this themselves — it's meant to be
# read via AJAX polling, not submitted as form input — so blocking it
# outright costs ~nothing. Case-insensitive since the only risk of casing it
# loosely is a false positive on a field name no real form uses anyway.
SecRule ARGS_NAMES "@rx (?i:^PHP_SESSION_UPLOAD_PROGRESS$)" \
    "id:910040,\
    phase:2,\
    deny,status:403,\
    log,\
    msg:'Blocked PHP session.upload_progress field (CVE-2026-109618/109619 mitigation)',\
    t:none"

# CVE-2026-109618's trigger is PHP hitting its own memory_limit mid-request
# and mishandling the resulting half-initialized state. Capping how much
# non-file form data a single request can carry makes that OOM condition
# much harder to reach through this path. This is what
# SecRequestBodyNoFilesLimit above is *supposed* to do and doesn't (see the
# comment on it) -- this rule is the part that actually enforces it,
# checking each parsed field individually (so one write-up-sized field
# doesn't get averaged away against a large legitimate file in the same
# request). 16KB is generous for real form fields (names, emails, comments,
# tokens) and well below anything that meaningfully contributes to
# exhausting PHP's default 128M memory_limit.
SecRule ARGS "@gt 16384" \
    "id:910042,\
    phase:2,\
    deny,status:413,\
    log,\
    msg:'Form field exceeds maximum allowed size (CVE-2026-109618 mitigation)',\
    t:length"

# Reject anything ModSecurity's own body processor couldn't fully parse,
# rather than forwarding it upstream for PHP's multipart parser to interpret
# on its own, possibly differently. Confirmed empirically to catch a
# truncated body (no closing boundary), a Content-Type boundary that never
# appears in the body, and a part missing its Content-Disposition name= —
# all set REQBODY_ERROR, all currently allowed through without this rule.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:910041,\
    phase:2,\
    deny,status:400,\
    log,\
    msg:'Failed to parse request body (malformed multipart)'"
